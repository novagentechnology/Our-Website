server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: novagen-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/novagen_db}
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.novagen: INFO
    org.springframework.data.mongodb: WARN
