name: CI/CD Pipeline - Build & Test

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  # ==========================================
  # Frontend Test & Build Job
  # ==========================================
  frontend-ci:
    name: Frontend (React + TypeScript + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build Bundle
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 7

  # ==========================================
  # Backend Test & Build Job
  # ==========================================
  backend-ci:
    name: Backend (Java 17 + Spring Boot + Maven)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit & Slice Tests
        run: mvn clean test --batch-mode

      - name: Package Spring Boot Executable JAR
        run: mvn package -DskipTests --batch-mode

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ./backend/target/*.jar
          retention-days: 7
